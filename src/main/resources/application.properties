spring.application.name=tienda
server.port=8080

#Clase 2
#Para definir el formato de despliegue de fecha/hora del log
logging.pattern.dateformat=hh:mm

#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false

#Clase 3
#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop

#Conexión nube aiven a la BD Techshop en MySQL
#spring.datasource.url=jdbc:mysql://techshop-techshop-kgomez80579.d.aivencloud.com:14229/techshop?ssl-mode=REQUIRED
 
#Usuario y clave de creaTablas.sql
spring.datasource.username=root
spring.datasource.password=root

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

#Clase 4 1/6/2026
